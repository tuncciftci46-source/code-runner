openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: MacSkor - Canlı Maç Takip & Analiz API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: matches
    description: Match operations
  - name: leagues
    description: League operations
  - name: odds
    description: Odds and predictions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [live, upcoming, finished, all]
        - name: leagueSlug
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/live:
    get:
      operationId: getLiveMatches
      tags: [matches]
      summary: Get live matches
      responses:
        "200":
          description: Live matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/summary:
    get:
      operationId: getMatchSummary
      tags: [matches]
      summary: Dashboard summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSummary"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{id}/events:
    get:
      operationId: getMatchEvents
      tags: [matches]
      summary: Get match events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"

  /leagues:
    get:
      operationId: listLeagues
      tags: [leagues]
      summary: List supported leagues
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"

  /leagues/{slug}/standings:
    get:
      operationId: getStandings
      tags: [leagues]
      summary: Get league standings
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: League standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"

  /odds/{matchId}:
    get:
      operationId: getOdds
      tags: [odds]
      summary: Get iddaa-style odds for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Odds and predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Odds"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /odds:
    get:
      operationId: listOdds
      tags: [odds]
      summary: Get odds for all today's matches
      responses:
        "200":
          description: All odds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Odds"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        logo:
          type: string
        color:
          type: string
        form:
          type: ["string", "null"]
      required: [id, name, shortName, logo, color, form]

    League:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        country:
          type: string
        logo:
          type: string
      required: [slug, name, country, logo]

    Match:
      type: object
      properties:
        id:
          type: string
        leagueSlug:
          type: string
        leagueName:
          type: string
        leagueLogo:
          type: string
        leagueCountry:
          type: string
        homeTeam:
          $ref: "#/components/schemas/Team"
        awayTeam:
          $ref: "#/components/schemas/Team"
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        homeScoreHT:
          type: ["integer", "null"]
        awayScoreHT:
          type: ["integer", "null"]
        status:
          type: string
          enum: [live, upcoming, finished, halftime]
        minute:
          type: ["string", "null"]
        startTime:
          type: string
        date:
          type: string
        venue:
          type: ["string", "null"]
      required:
        - id
        - leagueSlug
        - leagueName
        - leagueLogo
        - leagueCountry
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
        - homeScoreHT
        - awayScoreHT
        - status
        - minute
        - startTime
        - date
        - venue

    MatchStats:
      type: object
      properties:
        homePossession:
          type: integer
        awayPossession:
          type: integer
        homeShots:
          type: integer
        awayShots:
          type: integer
        homeShotsOnTarget:
          type: integer
        awayShotsOnTarget:
          type: integer
        homeCorners:
          type: integer
        awayCorners:
          type: integer
        homeFouls:
          type: integer
        awayFouls:
          type: integer
        homeYellowCards:
          type: integer
        awayYellowCards:
          type: integer
        homeRedCards:
          type: integer
        awayRedCards:
          type: integer
        homeOffsides:
          type: integer
        awayOffsides:
          type: integer
      required:
        - homePossession
        - awayPossession
        - homeShots
        - awayShots
        - homeShotsOnTarget
        - awayShotsOnTarget
        - homeCorners
        - awayCorners
        - homeFouls
        - awayFouls
        - homeYellowCards
        - awayYellowCards
        - homeRedCards
        - awayRedCards
        - homeOffsides
        - awayOffsides

    MatchDetail:
      type: object
      properties:
        id:
          type: string
        leagueSlug:
          type: string
        leagueName:
          type: string
        leagueLogo:
          type: string
        leagueCountry:
          type: string
        homeTeam:
          $ref: "#/components/schemas/Team"
        awayTeam:
          $ref: "#/components/schemas/Team"
        homeScore:
          type: ["integer", "null"]
        awayScore:
          type: ["integer", "null"]
        homeScoreHT:
          type: ["integer", "null"]
        awayScoreHT:
          type: ["integer", "null"]
        status:
          type: string
          enum: [live, upcoming, finished, halftime]
        minute:
          type: ["string", "null"]
        startTime:
          type: string
        date:
          type: string
        venue:
          type: ["string", "null"]
        stats:
          $ref: "#/components/schemas/MatchStats"
      required:
        - id
        - leagueSlug
        - leagueName
        - leagueLogo
        - leagueCountry
        - homeTeam
        - awayTeam
        - homeScore
        - awayScore
        - homeScoreHT
        - awayScoreHT
        - status
        - minute
        - startTime
        - date
        - venue
        - stats

    MatchEvent:
      type: object
      properties:
        id:
          type: string
        matchId:
          type: string
        minute:
          type: string
        type:
          type: string
          enum: [goal, yellow_card, red_card, substitution, penalty, own_goal, var]
        team:
          type: string
          enum: [home, away]
        playerName:
          type: string
        assistName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
      required:
        - id
        - matchId
        - minute
        - type
        - team
        - playerName
        - assistName
        - description

    MatchSummary:
      type: object
      properties:
        liveCount:
          type: integer
        upcomingCount:
          type: integer
        finishedCount:
          type: integer
        totalGoalsToday:
          type: integer
        totalMatches:
          type: integer
      required:
        - liveCount
        - upcomingCount
        - finishedCount
        - totalGoalsToday
        - totalMatches

    Standing:
      type: object
      properties:
        rank:
          type: integer
        team:
          $ref: "#/components/schemas/Team"
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goalsFor:
          type: integer
        goalsAgainst:
          type: integer
        goalDifference:
          type: integer
        points:
          type: integer
        form:
          type: string
      required:
        - rank
        - team
        - played
        - won
        - drawn
        - lost
        - goalsFor
        - goalsAgainst
        - goalDifference
        - points
        - form

    ScorePrediction:
      type: object
      properties:
        score:
          type: string
        probability:
          type: number
      required: [score, probability]

    Odds:
      type: object
      properties:
        matchId:
          type: string
        homeWin:
          type: number
        draw:
          type: number
        awayWin:
          type: number
        homeOdds:
          type: number
        drawOdds:
          type: number
        awayOdds:
          type: number
        btts:
          type: number
        noBtts:
          type: number
        over25:
          type: number
        under25:
          type: number
        over15:
          type: number
        under15:
          type: number
        htHome:
          type: number
        htDraw:
          type: number
        htAway:
          type: number
        htHomeOdds:
          type: number
        htDrawOdds:
          type: number
        htAwayOdds:
          type: number
        topScores:
          type: array
          items:
            $ref: "#/components/schemas/ScorePrediction"
        confidence:
          type: string
          enum: [low, medium, high]
        analysis:
          type: string
        expectedGoalsHome:
          type: number
        expectedGoalsAway:
          type: number
      required:
        - matchId
        - homeWin
        - draw
        - awayWin
        - homeOdds
        - drawOdds
        - awayOdds
        - btts
        - noBtts
        - over25
        - under25
        - over15
        - under15
        - htHome
        - htDraw
        - htAway
        - htHomeOdds
        - htDrawOdds
        - htAwayOdds
        - topScores
        - confidence
        - analysis
        - expectedGoalsHome
        - expectedGoalsAway
